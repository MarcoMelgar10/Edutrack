# EduTrack interface text - English (the default language).
#
# Rules: add every key to messages_es.properties too (BundleConsistencyTest checks it); append a feature's
# keys under its own comment header. A text that takes arguments ({0}, {1}) is a MessageFormat pattern, so a
# literal apostrophe is written twice (can''t); a text without arguments is used as written (can't).
# Plural forms are key.one / key.other with the count as {0}. In FXML write %key.

